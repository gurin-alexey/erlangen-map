/* Layout: field map — the map is the page; a narrow ledger of territories sits beside it (below it on phones). */
:root {
  --bg: #eceeea; --panel: #fbfbf8; --ink: #18201c; --muted: #5a6761; --line: #d3d9d4; --accent: #1d6b57;
  --map-bg: #e7e9e3; --bld: #d4d7cf; --bld-edge: #c4c8bf; --road: #ffffff; --road-case: #c6ccc6; --major: #fff6dc; --major-case: #d4c48f;
  --path: #9aa59f; --green: #cfe0c3; --rail: #7d8580; --label: #3c4742; --halo: rgba(255,255,255,.85);
  --font-ui: "Golos Text", "Segoe UI", system-ui, sans-serif;
  --font-num: "Unbounded", "Golos Text", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111513; --panel: #171c1a; --ink: #e5ebe7; --muted: #95a39c; --line: #2a322e; --accent: #5fc2a4;
  --map-bg: #1a1f1c; --bld: #262d29; --bld-edge: #2f3732; --road: #39413d; --road-case: #222825; --major: #4a4a3c; --major-case: #2b2b22;
  --path: #4f5a55; --green: #1f2e25; --rail: #6c756f; --label: #b9c5bf; --halo: rgba(17,21,19,.8); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111513; --panel: #171c1a; --ink: #e5ebe7; --muted: #95a39c; --line: #2a322e; --accent: #5fc2a4;
  --map-bg: #1a1f1c; --bld: #262d29; --bld-edge: #2f3732; --road: #39413d; --road-case: #222825; --major: #4a4a3c; --major-case: #2b2b22;
  --path: #4f5a55; --green: #1f2e25; --rail: #6c756f; --label: #b9c5bf; --halo: rgba(17,21,19,.8); color-scheme: dark }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-ui); }
.app { height: 100%; display: grid; grid-template-columns: 360px 1fr; }
.panel { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; min-width: 0;
  padding-block: 18px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px;
  display: flex; flex-direction: column; gap: 16px; }
#map { background: var(--map-bg); min-height: 0; }

header h1 { font: 700 20px/1.15 var(--font-num); margin: 0; letter-spacing: -.01em; text-wrap: balance; }
header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

.list { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 10px;
  height: 44px; font: 700 16px var(--font-num); cursor: pointer; position: relative; padding: 0; }
.chip::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--c); }
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.chip:focus-visible, .btn:focus-visible, .all:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.detail { display: flex; flex-direction: column; gap: 14px; }
.detail h2 { margin: 0; display: flex; align-items: center; gap: 12px; font: 600 17px var(--font-ui); }
.badge { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  font: 700 18px var(--font-num); color: #fff; background: var(--c); }
.meta { color: var(--muted); font-size: 13px; font-weight: 400; display: block; }
.bounds { display: grid; grid-template-columns: 22px 1fr; gap: 4px 8px; margin: 0; font-size: 14px; }
.bounds dt { font: 600 11px/20px var(--font-ui); letter-spacing: .06em; color: var(--muted); }
.bounds dd { margin: 0; min-width: 0; }
.sec h3 { margin: 0 0 6px; font: 600 11px var(--font-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.streets { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
.streets li { border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 13px; }
.streets.edge li { border-style: dashed; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { flex: 1 1 140px; display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 14px;
  border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: 500 14px var(--font-ui);
  text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn:hover { filter: brightness(1.05); border-color: var(--muted); }
.share { font-size: 12px; color: var(--muted); word-break: break-all; user-select: all; }
.all { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--accent); font: 500 14px var(--font-ui); cursor: pointer; }
.overview { font-size: 14px; color: var(--muted); margin: 0; }
.overview b { color: var(--ink); font-weight: 600; }
footer { margin-top: auto; font-size: 11px; color: var(--muted); }

/* map overlays */
.leaflet-container { background: var(--map-bg); font-family: var(--font-ui); }
.leaflet-bar a { background: var(--panel); color: var(--ink); border-color: var(--line); }
.leaflet-control-attribution { background: var(--halo) !important; color: var(--muted); }

.num { display: grid; place-items: center; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;

    const t = T.find(t => inRing(ll, t.ring));
    const accTxt = r > 40 ? ` · точность ±${Math.round(r)} м` : '';
    if (t) { setState('in', `Вы в участке <b>${t.id}</b>${accTxt}`, tcolor(t)); pill.innerHTML = `Вы в участке <b>${t.id}</b>`; pill.style.setProperty('--c', tcolor(t)); }
    else { setState('out', `Вы вне участков${accTxt}`); pill.textContent = 'Вы вне участков'; }
    pill.hidden = false;
    if (firstFix) { firstFix = false; if (!t && !allBounds.pad(0.5).contains(ll)) { follow = false; return; } }
    if (follow) map.panTo(ll, { animate: true });
  }
  function onErr(e) {
    if (e.code !== 1 && me) return; // a late timeout must not hide a position we already have
    const msg = e.code === 1 ? 'Нет доступа к геопозиции. Разрешите её для этого сайта в настройках браузера.'
              : 'Не удаётся определить положение. Проверьте, что геолокация включена.';
    setState('err', msg); pill.hidden = true;
    if (e.code === 1) { navigator.geolocation.clearWatch(watch); watch = null; whereBtn.textContent = 'Где я'; try { localStorage.removeItem('geo'); } catch {} }
  }
  function startGeo() {
    if (watch !== null) return centerMe();
    follow = true; firstFix = true; setState('off', 'Определяю положение…');
    watch = navigator.geolocation.watchPosition(onPos, onErr, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
    whereBtn.textContent = 'Скрыть'; try { localStorage.setItem('geo', '1'); } catch {}
  }
  function stopGeo() {
    navigator.geolocation.clearWatch(watch); watch = null; me?.remove(); acc?.remove(); me = acc = null;
    setState('off', 'Ваше положение не показано'); pill.hidden = true; whereBtn.textContent = 'Где я'; try { localStorage.removeItem('geo'); } catch {}
  }
  whereBtn.onclick = () => (watch === null ? startGeo() : stopGeo());
  try { if (localStorage.getItem('geo') === '1') startGeo(); } catch {}
}

addEventListener('hashchange', () => { const h = (location.hash.match(/^#t(\d)$/) || [])[1]; if (h && h !== current) select(h); });
</script>
